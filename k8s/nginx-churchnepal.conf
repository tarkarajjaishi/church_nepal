# ChurchNepal — host nginx in front of the k3s NodePorts.
#
# Host is forwarded verbatim on purpose: the church API reads the first DNS
# label off it to choose the tenant database. Rewriting it here would serve
# every church the same site.
#
# Exact server_names are matched before the wildcard by nginx, so admin/www/apex
# reach the control plane and everything else is a church.
#
# TLS is a WILDCARD cert (churchnepal.com + *.churchnepal.com), so a church
# created tomorrow is already covered — no per-church certificate step. That
# requires DNS-01; HTTP-01 cannot issue a wildcard. Renewal re-reads the
# Cloudflare token, so /root/cf.ini must stay in place:
#
#     sudo certbot certonly --dns-cloudflare \
#          --dns-cloudflare-credentials /root/cf.ini \
#          --dns-cloudflare-propagation-seconds 30 \
#          --cert-name churchnepal -d churchnepal.com -d '*.churchnepal.com'
#
# The wildcard covers ONE level only: a.churchnepal.com is covered,
# a.b.churchnepal.com is not.

upstream churchnepal_control_ui  { server 127.0.0.1:30200; keepalive 16; }
upstream churchnepal_control_api { server 127.0.0.1:30210; keepalive 16; }
upstream churchnepal_church_ui   { server 127.0.0.1:30080; keepalive 16; }
upstream churchnepal_church_api  { server 127.0.0.1:30082; keepalive 16; }

# Shared proxy settings. Host is passed through untouched — see above.
# (nginx has no "include from string", so this lives in a file.)

# ── HTTP: redirect everything to HTTPS, except the ACME challenge ───────────
server {
    listen 80;
    listen [::]:80;
    server_name churchnepal.com www.churchnepal.com admin.churchnepal.com *.churchnepal.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ── Platform: marketing site + control console ──────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name churchnepal.com www.churchnepal.com admin.churchnepal.com;

    ssl_certificate     /etc/letsencrypt/live/churchnepal/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/churchnepal/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    location /api {
        proxy_pass http://churchnepal_control_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://churchnepal_control_ui;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}

# ── Every church: <slug>.churchnepal.com ────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name *.churchnepal.com;

    ssl_certificate     /etc/letsencrypt/live/churchnepal/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/churchnepal/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25m;

    # ── /api is split between two backends ──────────────────────────────────
    # Most of /api is the Rust church API, but the Next app serves a handful of
    # its own route handlers under /api too. Sending all of /api to Rust made
    # those 404 — the Bible reader sat on loading skeletons forever, because
    # React Query keeps retrying and never reports an error.
    #
    # `^~` outranks the regex below, so eSewa's callbacks stay on the Rust side
    # even though /api/give itself is Next's.
    location ^~ /api/give/esewa {
        proxy_pass http://churchnepal_church_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Next's own handlers: app/api/{bible,calendar,client-errors,give,push}.
    # Keep this list in step with `find nextjs/app/api -name route.ts`.
    location ~ ^/api/(bible|calendar|client-errors|push/|give(/success)?$) {
        proxy_pass http://churchnepal_church_ui;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api {
        proxy_pass http://churchnepal_church_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://churchnepal_church_ui;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
