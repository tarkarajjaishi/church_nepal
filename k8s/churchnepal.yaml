# ChurchNepal for THIS host (ubuntu-kathmandu-01).
#
# Differs from k8s/churchnepal.yaml because this k3s was installed with
# `--disable traefik --disable servicelb` and has no ingress controller: the
# host's nginx is the front door for padmacakes.com and nepalidriver.com
# already. So services are NodePort and nginx proxies to 127.0.0.1:<nodePort>,
# which is the convention already in use here.
#
# Requests are deliberately small — this box has ~1.4Gi available and two live
# sites on it.
---
apiVersion: v1
kind: Namespace
metadata:
  name: churchnepal
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: churchnepal-storage
  namespace: churchnepal
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: churchnepal
spec:
  clusterIP: None
  selector: { app: postgres }
  ports: [{ port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: churchnepal
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: churchnepal-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "postgres"] }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits:   { cpu: 800m, memory: 640Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: church-api
  namespace: churchnepal
spec:
  replicas: 1
  selector: { matchLabels: { app: church-api } }
  template:
    metadata:
      labels: { app: church-api }
    spec:
      securityContext: { runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001 }
      containers:
        - name: church-api
          image: churchnepal/church-api:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: churchnepal-secrets, key: POSTGRES_PASSWORD } }
            - name: PG_BASE_URL
              value: "postgres://postgres:$(POSTGRES_PASSWORD)@postgres:5432"
            - name: DATABASE_URL
              value: "postgres://postgres:$(POSTGRES_PASSWORD)@postgres:5432/postgres"
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: churchnepal-secrets, key: JWT_SECRET } }
            - name: INTERNAL_API_SECRET
              valueFrom: { secretKeyRef: { name: churchnepal-secrets, key: INTERNAL_API_SECRET } }
            - { name: BASE_DOMAIN, value: churchnepal.com }
            - { name: PORT, value: "3002" }
            - { name: DB_MIGRATE_ON_STARTUP, value: "false" }
            - { name: STORAGE_ROOT, value: /storage }
            - { name: RUST_LOG, value: info }
            - { name: SITE_DOMAIN, value: "https://churchnepal.com" }
          ports: [{ containerPort: 3002 }]
          volumeMounts: [{ name: storage, mountPath: /storage }]
          readinessProbe:
            tcpSocket: { port: 3002 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 800m, memory: 384Mi }
      volumes:
        - name: storage
          persistentVolumeClaim: { claimName: churchnepal-storage }
---
apiVersion: v1
kind: Service
metadata:
  name: church-api
  namespace: churchnepal
spec:
  type: NodePort
  selector: { app: church-api }
  ports: [{ port: 3002, targetPort: 3002, nodePort: 30082 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: church-ui
  namespace: churchnepal
spec:
  replicas: 1
  selector: { matchLabels: { app: church-ui } }
  template:
    metadata:
      labels: { app: church-ui }
    spec:
      containers:
        - name: church-ui
          image: churchnepal/church-ui:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: API_INTERNAL_ORIGIN, value: "http://church-api:3002" }
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 50m, memory: 160Mi }
            limits:   { cpu: 800m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: church-ui
  namespace: churchnepal
spec:
  type: NodePort
  selector: { app: church-ui }
  ports: [{ port: 3000, targetPort: 3000, nodePort: 30080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-api
  namespace: churchnepal
spec:
  replicas: 1
  selector: { matchLabels: { app: control-api } }
  template:
    metadata:
      labels: { app: control-api }
    spec:
      securityContext: { runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001 }
      containers:
        - name: control-api
          image: churchnepal/control-api:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: churchnepal-secrets, key: POSTGRES_PASSWORD } }
            - name: CONTROL_DATABASE_URL
              value: "postgres://postgres:$(POSTGRES_PASSWORD)@postgres:5432/churchnepal_control"
            - name: PG_SUPER_URL
              value: "postgres://postgres:$(POSTGRES_PASSWORD)@postgres:5432/postgres"
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: churchnepal-secrets, key: JWT_SECRET } }
            - name: INTERNAL_API_SECRET
              valueFrom: { secretKeyRef: { name: churchnepal-secrets, key: INTERNAL_API_SECRET } }
            - name: SUPER_ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: churchnepal-secrets, key: SUPER_ADMIN_EMAIL } }
            - name: SUPER_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: churchnepal-secrets, key: SUPER_ADMIN_PASSWORD } }
            - { name: PORT, value: "3100" }
            - { name: BASE_DOMAIN, value: churchnepal.com }
            - { name: CHURCH_MIGRATIONS_DIR, value: /app/church-migrations }
            - { name: STORAGE_ROOT, value: /storage }
            - { name: CHURCH_APP_URL, value: "http://church-api:3002" }
            - { name: PG_DUMP_COMMAND, value: pg_dump }
            - { name: RUST_LOG, value: info }
          ports: [{ containerPort: 3100 }]
          volumeMounts: [{ name: storage, mountPath: /storage }]
          readinessProbe:
            httpGet: { path: /readyz, port: 3100 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 800m, memory: 384Mi }
      volumes:
        - name: storage
          persistentVolumeClaim: { claimName: churchnepal-storage }
---
apiVersion: v1
kind: Service
metadata:
  name: control-api
  namespace: churchnepal
spec:
  type: NodePort
  selector: { app: control-api }
  ports: [{ port: 3100, targetPort: 3100, nodePort: 30210 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-ui
  namespace: churchnepal
spec:
  replicas: 1
  selector: { matchLabels: { app: control-ui } }
  template:
    metadata:
      labels: { app: control-ui }
    spec:
      containers:
        - name: control-ui
          image: churchnepal/control-ui:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3200 }]
          readinessProbe:
            tcpSocket: { port: 3200 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 50m, memory: 160Mi }
            limits:   { cpu: 800m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: control-ui
  namespace: churchnepal
spec:
  type: NodePort
  selector: { app: control-ui }
  ports: [{ port: 3200, targetPort: 3200, nodePort: 30200 }]
