# Wildcard TLS via Let's Encrypt DNS-01.
#
# Apply AFTER cert-manager is installed and its CRDs exist, and after the
# Cloudflare token secret is created — see the deploy steps.
#
# DNS-01 rather than HTTP-01 because a wildcard certificate cannot be issued
# any other way. That is also why Cloudflare needs an API token here: cert-manager
# creates a temporary TXT record on the zone to prove control of it.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: owner@churchnepal.com
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: churchnepal-tls
  namespace: churchnepal
spec:
  secretName: churchnepal-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  commonName: churchnepal.com
  dnsNames:
    - churchnepal.com
    - "*.churchnepal.com"
